[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heyzzabi-agents"
version = "0.1.0"
description = "헤이짜비 AI 에이전트 — 기획서/요구사항정의서/업무배분 생성 + 챗봇/딥리서치/반려패턴분석"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/heyzzabi_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
