[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heyzzabi-ai"
version = "0.1.0"
description = "헤이짜비 AI 에이전트 — 팀(SKN31-FINAL-1Team) ai/ 컨벤션 (per-agent + shared + prompts/yaml)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "instructor>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["heyzzabi_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
