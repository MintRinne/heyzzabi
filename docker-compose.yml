# 헤이짜비 전체 스택 — MySQL + Django(gunicorn) + 프론트(nginx). (모노레포 루트)
#
#   cp .env.deploy.example .env.deploy   # 값 채우기 (SECRET_KEY, DB 비번, OPENAI_API_KEY)
#   docker compose --env-file .env.deploy up -d --build
#   docker compose --env-file .env.deploy exec backend python manage.py seed --demo
#
#   접속: http://localhost:8080  (admin: http://localhost:8080/admin/)

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-heyzzabi}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-heyzzabi}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-heyzzabi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 필요}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DB_ENGINE: mysql
      DB_NAME: ${DB_NAME:-heyzzabi}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-heyzzabi}
      DB_HOST: db
      DB_PORT: "3306"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENABLE_DEV_TOOLS: ${ENABLE_DEV_TOOLS:-False}
      # 프론트와 nginx 뒤 같은 오리진이므로 CORS 불필요
      CORS_ALLOWED_ORIGINS: ""
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db_data:
